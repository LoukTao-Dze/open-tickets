@if (!isLoginRoute()) {
  <app-header></app-header>
  <app-sidenav></app-sidenav>

  @if (layout.isMobileNavOpen()) {
    <div class="nav-backdrop md:hidden" (click)="layout.closeMobileNav()"></div>
  }
}

<main [class.main-content]="!isLoginRoute()" [class.login-content]="isLoginRoute()">
  @if (!isLoginRoute() && menuAccess.loadFailed()) {
    <p class="menu-error" role="alert">
      Menu access could not be loaded.
      <button type="button" (click)="retryMenuAccess()">Retry</button>
    </p>
  }
  <router-outlet></router-outlet>
</main>

<app-loading></app-loading>
