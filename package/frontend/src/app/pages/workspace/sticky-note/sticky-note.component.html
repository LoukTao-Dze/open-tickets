<div
  class="sticky-note"
  [class.is-dragging]="isDragging"
  [class.is-editing]="isEditing"
  [style.background]="note.bgColor"
  [style.color]="note.textColor"
  [style.transform]="noteTransform"
  [style.width.px]="note.width"
  [style.height.px]="note.height"
  [style.zIndex]="note.zIndex"
>
  <input
    #labelInput
    class="sticky-note-label"
    [class.on-focus]="isLabelEditing"
    type="text"
    spellcheck="false"
    [value]="note.label"
    [readOnly]="!isLabelEditing"
    (input)="onLabelInput(labelInput.value)"
    (mousedown)="onLabelMouseDown($event)"
    (dblclick)="startEditingLabel(labelInput)"
    (blur)="stopEditingLabel()"
    placeholder="Sticky Note..."
  />
  @if (isContentEditing) {
    <div
      class="sticky-note-toolbar"
      role="toolbar"
      aria-label="Text formatting"
      (mousedown)="onToolbarMouseDown($event)"
    >
      <label class="sticky-note-toolbar-size" for="sticky-note-font-size">
        <span class="sr-only">Font size</span>
        <select
          id="sticky-note-font-size"
          [value]="note.fontSize ?? contentFontSize"
          (change)="setContentFontSize($any($event.target).value, contentInput)"
          (blur)="stopEditing($event)"
          aria-label="Font size"
        >
          @for (size of fontSizeOptions; track size) {
            <option [value]="size" [selected]="size === (note.fontSize ?? contentFontSize)">
              {{ size }} px
            </option>
          }
        </select>
      </label>
      <div class="sticky-note-color-control">
        <button
          class="sticky-note-toolbar-button sticky-note-color-button"
          type="button"
          aria-label="Change sticky note color"
          [attr.aria-expanded]="isColorPickerOpen"
          (click)="$event.stopPropagation(); toggleColorPicker()"
        >
          <span class="sticky-note-color-swatch" [style.background]="note.bgColor"></span>
        </button>
        @if (isColorPickerOpen) {
          <div class="sticky-note-color-picker">
            @for (color of stickyNoteColorOptions; track color.id) {
              <button
                class="sticky-note-color-option"
                type="button"
                [style.background]="color.bgColor"
                [attr.aria-label]="color.label"
                [title]="color.label"
                (click)="$event.stopPropagation(); chooseColor(color)"
              ></button>
            }
          </div>
        }
      </div>
      <button
        class="sticky-note-toolbar-button"
        [class.is-active]="isBoldActive"
        type="button"
        aria-label="Bold"
        [attr.aria-pressed]="isBoldActive"
        (click)="$event.stopPropagation(); applyFormat('bold', contentInput)"
      >
        <strong>B</strong>
      </button>
      <button
        class="sticky-note-toolbar-button"
        [class.is-active]="isItalicActive"
        type="button"
        aria-label="Italic"
        [attr.aria-pressed]="isItalicActive"
        (click)="$event.stopPropagation(); applyFormat('italic', contentInput)"
      >
        <em>I</em>
      </button>
      <button
        class="sticky-note-toolbar-button"
        [class.is-active]="isUnderlineActive"
        type="button"
        aria-label="Underline"
        [attr.aria-pressed]="isUnderlineActive"
        (click)="$event.stopPropagation(); applyFormat('underline', contentInput)"
      >
        <span class="sticky-note-toolbar-underline">U</span>
      </button>
      <button
        class="sticky-note-toolbar-button"
        [class.is-active]="isBack"
        type="button"
        aria-label="Send to back"
        (click)="$event.stopPropagation(); sendToBack()"
      >
        <span class="material-symbols-outlined">flip_to_back</span>
      </button>
    </div>
  }
  <div
    #contentInput
    class="sticky-note-content"
    [class.on-focus]="isContentEditing"
    [class.is-empty]="!note.content"
    [attr.contenteditable]="isEditing"
    [style.fontSize.px]="contentFontSize"
    [style.color]="note.textColor"
    [innerHTML]="note.content"
    (input)="onContentInput(contentInput.innerHTML, contentInput)"
    (mousedown)="onContentMouseDown($event)"
    (dblclick)="startEditing(contentInput)"
    (blur)="stopEditing($event)"
    (mouseup)="updateActiveFormats()"
    (keyup)="updateActiveFormats()"
  ></div>
  <div class="sticky-note-icon">
    <span class="material-symbols-outlined">{{ note.icon }}</span>
  </div>

  <div class="resize-handle resize-handle--nw" (mousedown)="onResizeMouseDown($event, 'nw')"></div>
  <div class="resize-handle resize-handle--ne" (mousedown)="onResizeMouseDown($event, 'ne')"></div>
  <div class="resize-handle resize-handle--sw" (mousedown)="onResizeMouseDown($event, 'sw')"></div>
  <div class="resize-handle resize-handle--se" (mousedown)="onResizeMouseDown($event, 'se')"></div>
</div>
