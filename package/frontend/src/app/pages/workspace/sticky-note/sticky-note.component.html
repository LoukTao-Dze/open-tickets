<div
  class="sticky-note"
  [class.is-dragging]="isDragging"
  [class.is-editing]="isEditing"
  [style.background]="note.bgColor"
  [style.color]="note.textColor"
  [style.transform]="noteTransform"
  [style.width.px]="note.width"
  [style.height.px]="note.height"
>
  <input
    #labelInput
    class="sticky-note-label"
    [class.on-focus]="isLabelEditing"
    type="text"
    spellcheck="false"
    [value]="note.label"
    [readOnly]="!isLabelEditing"
    (input)="onLabelInput(labelInput.value)"
    (mousedown)="onLabelMouseDown($event)"
    (dblclick)="startEditingLabel(labelInput)"
    (blur)="stopEditingLabel()"
    placeholder="Sticky Note..."
  />
  @if (isContentEditing) {
    <div
      class="sticky-note-toolbar"
      role="toolbar"
      aria-label="Text formatting"
      (mousedown)="onToolbarMouseDown($event)"
    >
      <label class="sticky-note-toolbar-size" for="sticky-note-font-size">
        <span class="sr-only">Font size</span>
        <select
          id="sticky-note-font-size"
          [value]="note.fontSize ?? contentFontSize"
          (change)="setContentFontSize($any($event.target).value)"
          aria-label="Font size"
        >
          @for (size of fontSizeOptions; track size) {
            <option [value]="size">{{ size }} px</option>
          }
        </select>
      </label>
      <button
        class="sticky-note-toolbar-button"
        [class.is-active]="note.isBold"
        type="button"
        aria-label="Bold"
        [attr.aria-pressed]="note.isBold"
        (click)="$event.stopPropagation(); toggleBold()"
      >
        <strong>B</strong>
      </button>
      <button
        class="sticky-note-toolbar-button"
        [class.is-active]="note.isUnderlined"
        type="button"
        aria-label="Underline"
        [attr.aria-pressed]="note.isUnderlined"
        (click)="$event.stopPropagation(); toggleUnderline()"
      >
        <span class="sticky-note-toolbar-underline">U</span>
      </button>
    </div>
  }
  <textarea
    #contentInput
    class="sticky-note-content"
    [class.on-focus]="isContentEditing"
    spellcheck="false"
    [style.fontSize.px]="contentFontSize"
    [style.fontWeight]="note.isBold ? 700 : 400"
    [style.textDecoration]="note.isUnderlined ? 'underline' : 'none'"
    [style.color]="note.textColor"
    [value]="note.content"
    [readOnly]="!isEditing"
    (input)="onContentInput(contentInput.value)"
    (mousedown)="onContentMouseDown($event)"
    (dblclick)="startEditing(contentInput)"
    (blur)="stopEditing()"
    placeholder="Write your note here..."
  ></textarea>
  <div class="sticky-note-icon">
    <span class="material-symbols-outlined">{{ note.icon }}</span>
  </div>

  <div class="resize-handle resize-handle--nw" (mousedown)="onResizeMouseDown($event, 'nw')"></div>
  <div class="resize-handle resize-handle--ne" (mousedown)="onResizeMouseDown($event, 'ne')"></div>
  <div class="resize-handle resize-handle--sw" (mousedown)="onResizeMouseDown($event, 'sw')"></div>
  <div class="resize-handle resize-handle--se" (mousedown)="onResizeMouseDown($event, 'se')"></div>
</div>
