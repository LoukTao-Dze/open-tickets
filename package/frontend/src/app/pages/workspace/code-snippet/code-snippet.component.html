<div
  class="code-snippet-wrapper"
  [style.width.px]="item.width"
  [style.height.px]="item.height"
  [style.--resize-handle-scale]="1 / zoom"
>
  <div class="code-snippet" [class.is-editing]="isEditing || isFileNameEditing">
    <div class="code-snippet-header">
      <div class="code-snippet-file">
        <span class="material-symbols-outlined">terminal</span>
        <input
          #fileNameInput
          class="code-snippet-filename-input"
          type="text"
          spellcheck="false"
          [value]="item.fileName"
          [readOnly]="!isFileNameEditing"
          (input)="onFileNameInput(fileNameInput.value)"
          (pointerdown)="onFileNameMouseDown($event)"
          (dblclick)="startEditingFileName(fileNameInput)"
          (blur)="stopEditingFileName()"
        />
      </div>
      <div class="code-snippet-dots">
        <div class="dot dot-error"></div>
        <div class="dot dot-tertiary"></div>
        <div class="dot dot-secondary"></div>
      </div>
    </div>
    <div class="code-snippet-body">
      <div
        #codeEditorHost
        class="code-snippet-code"
        (pointerdown)="onEditorMouseDown($event)"
        (dblclick)="startEditing()"
      ></div>
    </div>
  </div>

  <div
    class="resize-handle resize-handle--nw"
    (pointerdown)="onResizeMouseDown($event, 'nw')"
  ></div>
  <div
    class="resize-handle resize-handle--ne"
    (pointerdown)="onResizeMouseDown($event, 'ne')"
  ></div>
  <div
    class="resize-handle resize-handle--sw"
    (pointerdown)="onResizeMouseDown($event, 'sw')"
  ></div>
  <div
    class="resize-handle resize-handle--se"
    (pointerdown)="onResizeMouseDown($event, 'se')"
  ></div>
</div>
