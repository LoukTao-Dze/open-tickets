<nav class="sidenav">
  <div class="sidenav-top">
    <div class="brand">
      <div class="brand-icon">
        <span class="material-symbols-outlined text-on-primary-container">account_tree</span>
      </div>
      <div class="brand-project">
        <label class="sr-only" for="sidenav-project-select">Select project</label>
        <select
          id="sidenav-project-select"
          class="project-select"
          [(ngModel)]="selectedProjectId"
          [disabled]="projects.length === 0"
        >
          <option *ngFor="let project of projects" [value]="project.id">
            {{ project.project_name }}
          </option>
          <option *ngIf="projects.length === 0" value="">No projects</option>
        </select>
        <div class="brand-subtitle">{{ selectedProject?.status || 'Project workspace' }}</div>
      </div>
    </div>

    <div class="nav-links">
      <ng-container *ngFor="let link of navLinks">
        <a
          *ngIf="link.isActive"
          [routerLink]="link.route"
          routerLinkActive="active-link"
          class="nav-link"
        >
          <span class="material-symbols-outlined">{{ link.icon }}</span>
          <span class="nav-label">{{ link.label }}</span>
        </a>
      </ng-container>
    </div>
  </div>

  <div class="sidenav-bottom">
    <ng-container *ngFor="let link of bottomNavLinks">
      <a
        *ngIf="link.isActive"
        [routerLink]="link.route"
        routerLinkActive="active-link"
        class="nav-link"
      >
        <span class="material-symbols-outlined">{{ link.icon }}</span>
        <span class="nav-label">{{ link.label }}</span>
      </a>
    </ng-container>
  </div>
</nav>
