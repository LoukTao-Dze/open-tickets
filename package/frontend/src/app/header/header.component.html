<header
  class="fixed top-0 left-0 right-0 h-16 z-50 flex justify-between items-center px-lg bg-surface border-b border-outline-variant"
>
  <div class="flex items-center gap-md">
    <button
      type="button"
      class="menu-toggle md:hidden material-symbols-outlined text-on-surface-variant hover:bg-surface-container-highest p-xs rounded-full transition-colors"
      aria-label="Toggle navigation menu"
      (click)="layout.toggleMobileNav()"
    >
      menu
    </button>
    <span class="text-headline-md font-headline-md font-bold text-on-surface truncate"
      >DevOps Sentinel</span
    >
    <div
      class="hidden md:flex items-center bg-surface-container-highest px-md py-xs rounded-lg border border-outline-variant"
    >
      <span class="material-symbols-outlined text-on-surface-variant text-[18px] mr-xs"
        >search</span
      >
      <input
        class="bg-transparent border-none focus:ring-0 text-body-sm text-on-surface-variant w-64"
        placeholder="Search team or tickets..."
        type="text"
      />
    </div>
  </div>
  <div class="flex items-center gap-md">
    <button
      class="material-symbols-outlined text-on-surface-variant hover:bg-surface-container-highest p-xs rounded-full transition-colors"
    >
      notifications
    </button>
    <button
      class="material-symbols-outlined text-on-surface-variant hover:bg-surface-container-highest p-xs rounded-full transition-colors"
    >
      settings
    </button>
    <div
      class="flex h-8 w-8 items-center justify-center overflow-hidden rounded-full border border-outline-variant"
    >
      @if (src) {
        <img class="h-full w-full object-cover" alt="Lead Engineer Profile" [src]="src" />
      } @else {
        <span
          class="material-symbols-outlined flex h-full w-full items-center justify-center text-on-surface-variant"
          style="display: flex"
          aria-label="Lead Engineer Profile"
          role="img"
          >account_circle</span
        >
      }
    </div>
  </div>
</header>
